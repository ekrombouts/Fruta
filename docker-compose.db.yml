services:
  db:
    image: ankane/pgvector
    container_name: fruta-db-container
    networks:
      - fruta-net
    environment:
      - POSTGRES_USER=fruta
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=fruta
    ports:
      - 5432:5432
    volumes:
      - fruta_data:/var/lib/postgresql/data

volumes:
  fruta_data:

networks:
  fruta-net:
    external: true